name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      group_number:
        description: "Group number for final submission check (leave blank for regular checks)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Check workspace links
        run: python3 scripts/check_workspace.py

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install locked contract dependencies
        run: npm --prefix packages/contracts ci
      - name: Compile contracts
        run: npm --prefix packages/contracts run compile
      - name: Run contract acceptance tests
        run: npm --prefix packages/contracts run test:acceptance

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install locked web dependencies
        run: npm --prefix apps/web ci
      - name: Install compiler dependencies for browser deployment artifact
        run: npm --prefix packages/contracts ci
      - name: Type-check web
        run: npm --prefix apps/web run lint
      - name: Run web acceptance tests
        run: npm --prefix apps/web run test:acceptance
      - name: Build web
        run: npm --prefix apps/web run build

  submission:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.group_number != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install PDF metadata reader
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check final deliverables
        env:
          GROUP_NUMBER: ${{ inputs.group_number }}
        run: python3 scripts/check_submission.py --group "$GROUP_NUMBER"
